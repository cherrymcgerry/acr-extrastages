# Every DiRT Rally 2.0 stage. enabled stages fit (<= 9 km). default = true is the recommended 30.
# Specs are generated by scripts/gen-stage-specs.ps1 into work/acr/specs/ (gitignored).
# Ids: AcrXs<LocCode><Rally><Route> e.g. AcrXsNz01r5.
# menu_images = true: generated track map, route map, height profile and DR2-art backdrop / banner / lobby images
# (docs/menu-images.md); optional per stage: menu_art = "<DR2 loading tpk name>" or "none", menu_elevation_offset = <m>.
# Locations (new rows copy `template`; `row` joins an existing ACR location instead):
#   description = info-box text; country = vanilla DT_Countries row (flag + Nation); surface = Gravel / Tarmac / Snow (info box,
#   car-setup default and allowed tyres, copied from a vanilla location / stage of that surface);
#   tile / logo = vanilla DT_TracksLocationsBackgrounds / Logos row; otherwise the tile is cropped from DR2 loading art
#   (tile_art = "<tpk name>", default the location's first rally route 0) and the logo is a generated rally plate in
#   logo_colors = "<plate>,<stripe>,..." (scripts/menu-location-logos.ps1).

[locations.argentina]
name = "Argentina"
description = "Fast, flowing gravel roads through the hills of Córdoba, with tight hairpins, rocky edges and water splashes high above the plains."
template = "Wales"
sky = "argentina"
code = "Ar"
country = "Argentina"
surface = "Gravel"
logo_colors = "#2F6FB5,#FFFFFF,#74ACDF"

[locations.australia]
name = "Australia"
description = "Loose gravel stages in the Monaro region of New South Wales: wide, fast roads through eucalyptus forest on a ball-bearing surface that punishes late braking."
template = "Wales"
sky = "australia"
code = "Au"
country = "Australia"
surface = "Gravel"
logo_colors = "#00843D,#FFCD00"

[locations.finland]
name = "Finland"
description = "Narrow gravel roads through the lakes and forests of Central Finland, known for blind crests, big jumps and very high average speeds."
template = "Wales"
sky = "finland"
code = "Fi"
country = "FinlAnd"
surface = "Gravel"
logo_colors = "#003580,#FFFFFF"

[locations.france]
name = "Monte Carlo"
description = "Mountain asphalt in the Alpes-Maritimes above Monaco: tight hairpins, sheer drops and changing grip as the roads climb towards snow and ice."
template = "Wales"
sky = "france"
code = "Mc"
# ACR's own Monte Carlo tile, logo and nation
tile = "Montecarlo"
logo = "MonteCarlo"
country = "Monaco"
surface = "Tarmac"

[locations.germany]
name = "Germany"
description = "Tarmac stages through the vineyards and the Baumholder military area in Rhineland-Palatinate, mixing narrow farm lanes, concrete tank roads and unforgiving kerbs."
template = "Wales"
sky = "germany"
code = "De"
country = "Germany"
surface = "Tarmac"
logo_colors = "#1E1E1E,#DD0000,#FFCE00"

[locations.greece]
name = "Greece"
description = "Argolis"
# ACR's own Greece location (tile, logo, nation, description)
row = "Greece"
sky = "greece"
code = "Gr"

[locations.new_zealand]
name = "New Zealand"
description = "Smooth, flowing gravel roads through the hills of Hawke's Bay on the North Island, with sweeping corners, coastal views and plenty of camber."
template = "Wales"
sky = "nz"
code = "Nz"
country = "NewZealand"
surface = "Gravel"
logo_colors = "#1A1A1A,#FFFFFF"

[locations.poland]
name = "Poland"
description = "Fast gravel roads across the farmland and forests of Łęczna County in eastern Poland, with long straights, square junctions and deceptive crests."
template = "Wales"
sky = "poland"
code = "Pl"
country = "PolAnd"
surface = "Gravel"
logo_colors = "#DC143C,#FFFFFF"

[locations.scotland]
name = "Scotland"
description = "Gravel forest roads in Perth and Kinross: narrow, twisting stages between dense pines, with damp grip, blind crests and little room for error."
template = "Wales"
sky = "scotland"
code = "Sc"
# ACR has no Scotland nation row
country = "UnitedKingdom"
surface = "Gravel"
logo_colors = "#005EB8,#FFFFFF"

[locations.spain]
name = "Spain"
description = "Twisty asphalt roads in the hills of Catalonia, with grippy surfaces, endless hairpins and cut corners that drag gravel onto the line."
template = "Wales"
sky = "spain"
code = "Es"
country = "Spain"
surface = "Tarmac"
logo_colors = "#AA151B,#F1BF00"

[locations.sweden]
name = "Sweden"
description = "Winter rallying in Värmland: snow and ice on narrow forest roads, where the snowbanks are both a help and a trap."
template = "Wales"
sky = "sweden"
code = "Se"
country = "Sweden"
surface = "Snow"
logo_colors = "#006AA7,#FECC00"

[locations.usa]
name = "USA"
description = "Rough gravel roads through the woods of New England, with tight corners, rocky patches and fast sections between dense trees."
template = "Wales"
sky = "usa"
code = "Us"
country = "UnitedStates"
surface = "Gravel"
logo_colors = "#3C3B6E,#FFFFFF,#B22234"

[locations.wales]
name = "Wales"
description = "Powys"
# Reuse ACR's existing Wales location row (no Template)
row = "Wales"
sky = "wales"
code = "Wa"
