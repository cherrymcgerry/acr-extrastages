[package]
name = "stage-validate"
description = "Records ACR shared-memory telemetry while driving a ported stage and checks the run against the stage IR"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: not part of any other Cargo workspace in this repo.
[workspace]

[dependencies]
# Read-only ACR shared memory layouts, from the sibling acr-rewind checkout (not modified).
acr_shm = { path = "../../../acr-rewind/crates/acr_shm" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
