[package]
name = "stage-validate"
description = "Records ACR shared-memory telemetry while driving a ported stage and checks the run against the stage IR"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: not part of any other Cargo workspace in this repo.
[workspace]

[dependencies]
# Read-only ACR shared memory layouts from the public acr-rewind repo (Cargo finds the acr_shm crate inside its workspace).
acr_shm = { git = "https://github.com/cherrymcgerry/acr-rewind", rev = "6691f3a724b6ab8cce4d361987d8ec58c562bb70" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
